<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 322" width="1280" height="322" role="img" aria-label="Three ways into this repository: run it in sixty seconds, read the argument, or audit the boundary. Each route names its entry point.">
  <defs>
    <linearGradient id="tw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="60%" stop-color="#0E1116"/>
      <stop offset="100%" stop-color="#12161C"/>
    </linearGradient>
    <linearGradient id="tw-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C08B4F"/>
      <stop offset="50%" stop-color="#9AA3AD"/>
      <stop offset="100%" stop-color="#E0B24C" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="322" fill="url(#tw-bg)"/>
  <rect width="1280" height="322" fill="none" stroke="#1D232B" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="58" fill="#7C8794" font-size="13" letter-spacing="4.5">THREE WAYS IN &#183; PICK THE ONE YOU ARE</text>
  </g>
  <rect x="64" y="74" width="420" height="2" fill="url(#tw-rule)"/>

  <!-- ── route 1 ─────────────────────────────────────────────────────────── -->
  <g transform="translate(64, 108)">
    <rect x="0" y="0" width="352" height="166" rx="8" fill="#12171D" stroke="#2A323C" stroke-width="1.4"/>
    <rect x="0" y="0" width="352" height="3" rx="1.5" fill="#C08B4F"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="26" y="44" fill="#C08B4F" font-size="12" letter-spacing="2.5">01 &#183; RUN IT</text>
      <text x="26" y="140" fill="#8B95A1" font-size="12.5">./scripts/quickstart.sh</text>
    </g>
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#C4CBD3" font-size="15.5">
      <text x="26" y="76">Postgres, the asset graph, and a</text>
      <text x="26" y="99">seeded gold layer, in one command.</text>
    </g>
    <line x1="26" y1="116" x2="326" y2="116" stroke="#242B34" stroke-width="1"/>
  </g>

  <!-- ── route 2 ─────────────────────────────────────────────────────────── -->
  <g transform="translate(464, 108)">
    <rect x="0" y="0" width="352" height="166" rx="8" fill="#12171D" stroke="#2A323C" stroke-width="1.4"/>
    <rect x="0" y="0" width="352" height="3" rx="1.5" fill="#E0B24C"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="26" y="44" fill="#E0B24C" font-size="12" letter-spacing="2.5">02 &#183; READ THE ARGUMENT</text>
      <text x="26" y="140" fill="#8B95A1" font-size="12.5">docs/the-read-path.md</text>
    </g>
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#C4CBD3" font-size="15.5">
      <text x="26" y="76">Why exhibition&#8217;s data is legible to</text>
      <text x="26" y="99">its own system and to nothing else.</text>
    </g>
    <line x1="26" y1="116" x2="326" y2="116" stroke="#242B34" stroke-width="1"/>
  </g>

  <!-- ── route 3 ─────────────────────────────────────────────────────────── -->
  <g transform="translate(864, 108)">
    <rect x="0" y="0" width="352" height="166" rx="8" fill="#12171D" stroke="#2A323C" stroke-width="1.4"/>
    <rect x="0" y="0" width="352" height="3" rx="1.5" fill="#4E8C63"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="26" y="44" fill="#4E8C63" font-size="12" letter-spacing="2.5">03 &#183; AUDIT THE BOUNDARY</text>
      <text x="26" y="140" fill="#8B95A1" font-size="12.5">ARCHITECTURE.md &#167;7</text>
    </g>
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" fill="#C4CBD3" font-size="15.5">
      <text x="26" y="76">Start at the corrections. What broke</text>
      <text x="26" y="99">is the load-bearing part of the record.</text>
    </g>
    <line x1="26" y1="116" x2="326" y2="116" stroke="#242B34" stroke-width="1"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="64" y="302" fill="#6F7A87">every claim below ships the command that proves it &#183; done is a green exit code on a clean clone</text>
  </g>
</svg>
