# Local Postgres + Redpanda for bronze / quarantine / streaming proof commands.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema_ops
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init/001_schemas.sql:/docker-entrypoint-initdb.d/001_schemas.sql:ro
      - ./sql/bronze/001_quarantine.sql:/docker-entrypoint-initdb.d/010_quarantine.sql:ro
      - ./sql/bronze/002_quarantine_grants.sql:/docker-entrypoint-initdb.d/011_quarantine_grants.sql:ro
      - ./sql/001_bronze.sql:/docker-entrypoint-initdb.d/020_landing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema_ops"]
      interval: 2s
      timeout: 5s
      retries: 20

  # ADR-007 — Redpanda over Kafka. Single binary; Kafka-API compatible.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 3s
      timeout: 5s
      retries: 20
