# Local Postgres for bronze / quarantine proof commands.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema_ops
    ports:
      - "5432:5432"
    volumes:
      - ./sql/001_bronze.sql:/docker-entrypoint-initdb.d/001_bronze.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema_ops"]
      interval: 2s
      timeout: 5s
      retries: 20
