# Local Postgres + Redpanda for bronze / stream proof commands.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
      POSTGRES_DB: cinema_ops
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init/001_schemas.sql:/docker-entrypoint-initdb.d/001_schemas.sql:ro
      - ./sql/bronze/001_quarantine.sql:/docker-entrypoint-initdb.d/010_quarantine.sql:ro
      - ./sql/bronze/002_quarantine_grants.sql:/docker-entrypoint-initdb.d/011_quarantine_grants.sql:ro
      - ./sql/001_bronze.sql:/docker-entrypoint-initdb.d/020_landing.sql:ro
      - ./sql/bronze/003_events_raw.sql:/docker-entrypoint-initdb.d/030_events_raw.sql:ro
      - ./sql/bronze/004_events_raw_grants.sql:/docker-entrypoint-initdb.d/031_events_raw_grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema_ops"]
      interval: 2s
      timeout: 5s
      retries: 20

  # ADR-007 — Redpanda over Kafka. Kafka-API compatible; single binary.
  # Optional for VDE-21: the default prove path uses the file-backed log
  # (two terminals + psql). Set KAFKA_BOOTSTRAP=localhost:19092 to use this.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 5s
      timeout: 5s
      retries: 20
