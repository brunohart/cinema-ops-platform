[project]
name = "cinema-ops-platform"
version = "0.1.0"
description = "AI-native data pipelines for a cinema operations platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "confluent-kafka>=2.3",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dbt>=0.25",
    "structlog>=24.0",
]

[tool.dagster]
module_name = "orchestration.definitions"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.0",
]
dbt = ["dbt-postgres>=1.8,<1.11"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
# Integration suite needs Docker (testcontainers); unit suite stays offline.
markers = [
    "integration: full-DAG test against throwaway Postgres (testcontainers)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
