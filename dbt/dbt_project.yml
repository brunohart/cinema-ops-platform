# VDE-24 — dbt Core project for silver (and later gold) transforms.
# ADR-004: models for silver and gold; bronze stays DDL + extractors.

name: cinema_ops
version: 1.0.0
config-version: 2
profile: cinema_ops

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
docs-paths: ["docs"]

target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

models:
  cinema_ops:
    silver:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
      +tags: ["silver"]
